x-app: &app
  build:
    context: .
    target: runtime
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://jobs:jobs@db:5432/jobs

x-worker: &worker
  <<: *app
  command: ["python", "-m", "worker"]
  restart: unless-stopped
  # SIGTERM lets the worker finish the current job before it exits.
  stop_grace_period: 30s
  depends_on:
    api:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      # Dev tokens. In a real deployment they come from a secret store.
      WORKER_TOKENS: worker-1:${WORKER_1_TOKEN:-dev-token-1},worker-2:${WORKER_2_TOKEN:-dev-token-2}
      LEASE_TIMEOUT_SECONDS: ${LEASE_TIMEOUT_SECONDS:-600}
      MAX_RUNTIME_SECONDS: ${MAX_RUNTIME_SECONDS:-3600}
      REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 10

  worker-1:
    <<: *worker
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_1_TOKEN:-dev-token-1}

  worker-2:
    <<: *worker
    environment:
      API_URL: http://api:8000
      WORKER_TOKEN: ${WORKER_2_TOKEN:-dev-token-2}

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://jobs:jobs@db:5432/jobs_test
    depends_on:
      db:
        condition: service_healthy
